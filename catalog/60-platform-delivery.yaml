# =============================================================================
# SUPPORT SYSTEM - PLATFORM DELIVERY   (deliberately NOT one of the five)
#
# How all five systems are built, configured and shipped. Named as its own system
# rather than filed under one of the five, because filing shared machinery inside a
# capability is exactly what produced `build-input -> domain: subsystems`.
#
# Two members, and they are the platform's genuine cross-cutting concern: every
# workflow-plane pod receives its configuration as literal env vars holding JSON blobs
# - no ConfigMaps, no Secrets, no volumes - generated by devops-pipeline from
# workflow-config. A property of every component, owned by none of them.
#
# devops-pipeline is NOT indexed as source, but IS read as the authoritative mapping
# from role -> pod -> image -> env, because that is where the mapping is decided.
# =============================================================================

components:
  - name: workflow-config
    system: platform-delivery
    kind: Config
    plane: none
    audience: all
    profile: build-input
    role: >
      Layered per-environment configuration, merged env -> workflow -> variant -> tenant ->
      version. This is where WORKER_MODE actually GETS ITS VALUE in production, which is why
      it declares the var hundreds of times without being a role itself.
    source:
      repo: workflow-config
      remote: https://github.com/element5inc/e5-platform-workflow-config.git
      paths: ["**/*.yaml", libs/scripts/**]

  - name: devops-pipeline
    system: platform-delivery
    kind: Tooling
    plane: none
    audience: all
    profile: excluded
    role: >
      CI tooling and the deployment-config generator. Excluded from the knowledge base as a
      Component, but it is READ as the authoritative source for role -> pod -> image -> env
      mapping, because it is where that mapping is actually decided.
    source:
      repo: devops-pipeline
      remote: https://github.com/element5inc/e5-platform-devops-pipeline.git
      paths: [libs/deployment-config-generator/**]
    read_as: authoritative-deployment-topology

