# Binary dependencies that hold load-bearing logic but have NO source checkout.
# These are a distinct provenance class: facts from them come from a disassembled jar,
# cannot be re-derived by the source indexer, and go stale invisibly on a version bump.
# AKST's entire dequeue ordering - the platform's hottest query - lives only here.
binary_dependencies:
  - id: state-service
    coordinate: e5.state:StateService:1.2.8
    pinned_at: platform-core/build.gradle:238
    holds: >
      TaskProcessor.buildQuery - the AKST dequeue ORDER BY, the filters-affinity
      predicate, and the FOR UPDATE SKIP LOCKED clause. No source repo exists in the
      workspace; facts were recovered by disassembly.
    provenance: disassembled-jar
    source_repo: UNKNOWN - no checkout in this workspace
  - id: task-sdk-java
    coordinate: e5-task-sdk-java:0.7.3
    pinned_at: multiple
    holds: >
      TaskTransport/TaskInfo/MetaInfo JSON schemas and the Command, EndpointType,
      WorkerType, ResponseEventType enums. GROUND TRUTH for the wire protocol -
      ranked above all source and all documentation.
    provenance: sdk-schema
    source_repo: UNKNOWN - no checkout in this workspace

# Confluence ingestion is an explicit ALLOWLIST, never a space crawl.
# EKB has 1085 pages of which ~60% is customer RPA content, not platform engineering.
# Discovery must be CQL-based: 54 folders hold all 2026 work and are invisible to the pages API.
confluence:
  cloud_id: 41d2a7a1-718f-4dce-92b2-0072860a509d
  site: element5.atlassian.net
  spaces_full:        [pltfrm, 2E]     # small, high signal - ingest fully
  spaces_allowlisted: [EKB]            # curated page list only
  spaces_cherry_pick: [A2, TG]         # bulk is customer delivery
  spaces_excluded:    [TS, PE, EAC, FT, MAR, O, SER, PLAYBOOK]

# Provenance precedence. Higher wins when sources conflict.
provenance_rank:
  - sdk-schema         # e5-task-sdk-java jar schemas + enums: ground truth for the wire
  - code               # service source at the recorded commit
  - disassembled-jar   # logic recovered from a binary with no source checkout.
                       # Ranked below source NOT because it is less true - it is the
                       # running code - but because it cannot be re-verified by the
                       # indexer and goes stale invisibly. Always cite the coordinate.
  - live-cluster     # read-only kubectl: what is actually running
  - config           # deployment-configs, build-config.yaml
  - confluence-design
  - confluence-pip
  - readme
  - inferred
