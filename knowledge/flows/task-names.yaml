# Task routing: which subsystem handles each task, and who sends it.
#
# The join between repositories is the TASK NAME / fbName, a string one repo writes and
# another compares. No proto or schema carries it, so this file is authored. Every row was
# re-verified against the code at the indexed release on 2026-11-14:
#   interface        release/v1.7.6   workflow-manager release/v1.4.7
#   workflow-ops     release/v1.7.4   monitoring-service release/v1.5.9
#   dynamic-scaling  release/v1.3.2   credential-monitor release/v1.1.1
#   rf-fb-worker-core release/v1.1.14
#
# task_name   the name the producer uses (for interface: the TaskManagerHelperImpl case)
# task_type   the taskType set on the envelope
# fb_name     the value the handler dispatches on (taskPayload.fbName)
# produced_by / produced_at   the sending component and its code site
# handled_by / site / line    the handling component and the dispatch branch
# A null means the code does not show it. It is never filled in by guessing.

